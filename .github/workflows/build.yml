name: WebUI critical checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  webui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build real WebUI assets
        run: |
          make build
          test -s dist/index.html
          test -s dist/peakactivity.svg
          test -s dist/LICENSE.txt
      - name: Check plugin consent and approval UI
        run: npm test -- --selectProjects jsdom --runTestsByPath test/unit/PluginSettings.test.js --runInBand --coverage=false
      - name: Check dependency lock is unchanged
        run: git diff --exit-code -- package-lock.json
